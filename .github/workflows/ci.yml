name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Check web app and repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check HTML and inline JavaScript
        run: python3 scripts/check_web.py index.html

      - name: Check synchronized web and Android files
        run: python3 scripts/check_repo.py

      - name: Check release version parser
        run: |
          python3 scripts/calculate_version.py v1.1.1 > /tmp/version-output
          grep -qx 'name=1.1.1' /tmp/version-output
          grep -qx 'code=1001001' /tmp/version-output
          if python3 scripts/calculate_version.py v1.1 >/dev/null 2>&1; then
            echo 'Invalid tag unexpectedly passed version validation.' >&2
            exit 1
          fi

  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: web-check
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Firebase build config
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
          fi
          python3 -m json.tool android/app/google-services.json >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle -p android --no-daemon clean assembleDebug

      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: 74ls-logic-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
