plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// CI may supply a signed release configuration via environment variables.
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && !value.trim().isEmpty()
}

// Release workflow passes -PversionName / -PversionCode; local builds fall back to these defaults.
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('versionName') ?: '1.1.0').toString()

android {
    namespace 'com.seventyfourls.logiclab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.seventyfourls.logiclab'
        minSdk 24
        targetSdk 35
        versionCode = appVersionCode
        versionName = appVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.gms:play-services-auth:21.5.1'

    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.facebook.android:facebook-login:18.3.0'
}
